[package]
name = "automation-structures"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["Brian Moore"]
description = "Reusable, formally specified building blocks for composing automation systems."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/automation-structures"
repository = "https://github.com/brian-c-moore/automation-structures"
keywords = ["automation", "composition", "state-machine", "formal-methods", "verification"]
categories = ["algorithms", "data-structures"]
publish = ["crates-io"]

# The research repository's pinned verifier checks this same Rust source.
# Cargo supplies the ordinary downstream-consumer boundary.

[lib]
name = "automation_structures"
path = "src/lib.rs"

[dependencies]
vstd = "=0.0.0-2026-08-23-0033"

[package.metadata.verus]
verify = true

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
# These source spellings are part of the Verus proof and mutation-control
# boundary. Ordinary-Rust style rewrites must not silently change that source.
assign_op_pattern = "allow"
if_same_then_else = "allow"
len_zero = "allow"
manual_range_contains = "allow"
new_without_default = "allow"
ptr_arg = "allow"
redundant_pattern_matching = "allow"
vec_init_then_push = "allow"
