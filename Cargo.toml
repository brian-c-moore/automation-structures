[package]
name = "automation-structures"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
authors = ["Brian Moore"]
description = "Checked state machines for budgets, selection, traversal, and automation execution flow."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/automation-structures"
repository = "https://github.com/brian-c-moore/automation-structures"
keywords = ["automation", "composition", "state-machine", "formal-methods", "verification"]
categories = ["algorithms", "data-structures"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/verification/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/MAINTAINER_ARCHITECTURE.md",
    "/SECURITY.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/.crate-quality.toml",
]

# The research repository's pinned verifier checks this same Rust source.
# Cargo supplies the ordinary downstream-consumer boundary.

[lib]
name = "automation_structures"
path = "src/lib.rs"

[features]
default = []
# Exposes the Verus carriers and relations for verified downstream
# crates. The checked runtime API remains available at the crate root.
proof-api = []

[dependencies]
vstd = "=0.0.0-2026-05-24-0157"
indexmap = "=2.14.2"

[package.metadata.verus]
verify = true

[package.metadata.docs.rs]
all-features = true

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "forbid"

[lints.clippy]
# Failure paths preserve typed outcomes and caller-owned resources.
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
exit = "deny"
fallible_impl_from = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
clone_on_ref_ptr = "deny"
large_enum_variant = "deny"
unnecessary_box_returns = "deny"
# Checked data access, representation and arithmetic boundaries.
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
integer_division = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
# These source spellings are part of the Verus proof and mutation-control
# boundary. Ordinary-Rust style rewrites must not silently change that source.
assign_op_pattern = "allow"
if_same_then_else = "allow"
len_zero = "allow"
manual_range_contains = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
new_without_default = "allow"
ptr_arg = "allow"
redundant_pattern_matching = "allow"
vec_init_then_push = "allow"
