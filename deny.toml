[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
# The checksum-pinned Verus proc-macro closure requires these exact old versions.
# run_dependency_boundary.sh rejects either version in the runtime dependency graph
# and separately rejects all runtime duplicates. Other versions remain denied.
skip = [
    { name = "hashbrown", version = "=0.12.3" },
    { name = "indexmap", version = "=1.9.3" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
